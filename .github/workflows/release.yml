# Mirrors `just release` on push to main:
# verify → cz bump (commit + tag) → push → crates.io (envro-derive, then envro) → GitHub Release
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Skip the bump commit itself on push (needed if a PAT is used to push).
    # Always allow manual runs (workflow_dispatch has no head_commit).
    if: ${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'bump:') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Fetch tags
        run: git fetch --tags --force

      # Commitizen incremental changelog (exit 16) requires a tag matching the crate version.
      - name: Check version matches a git tag
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p;}' Cargo.toml | head -1)"
          if [[ -z "$version" ]]; then
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          fi
          if ! git rev-parse -q --verify "refs/tags/${version}" >/dev/null; then
            echo "error: Cargo.toml version ${version} has no git tag '${version}'" >&2
            echo "latest tag: $(git describe --tags --abbrev=0 2>/dev/null || echo none)" >&2
            echo "fix: set Cargo.toml back to the latest tag, or create the missing tag." >&2
            exit 1
          fi

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Format check
        run: cargo fmt --check

      - name: Tests
        run: cargo test --tests -- --test-threads=1

      - name: Install commitizen
        run: pipx install commitizen

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          set +e
          cz bump --dry-run --yes
          status=$?
          set -e
          # 21 = NoneIncrementExit (no conventional commits to release)
          if [[ "$status" -eq 21 ]]; then
            echo "No releasable conventional commits since last tag; skipping publish."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi
          cz bump --yes
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "tag=$(git describe --tags --exact-match HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push bump commit and tag
        if: steps.bump.outputs.skipped == 'false'
        run: |
          # cz creates lightweight tags; --follow-tags only pushes annotated tags
          git push origin HEAD:main
          git push origin "refs/tags/${{ steps.bump.outputs.tag }}"

      # CARGO_REGISTRY_TOKEN must allow publish for both `envro-derive` and `envro`
      # (publish-new once for a new crate name, then publish-update).
      - name: Publish envro-derive to crates.io
        if: steps.bump.outputs.skipped == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set +e
          out="$(cargo publish -p envro-derive 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$out"
          if [[ "$status" -eq 0 ]]; then
            exit 0
          fi
          if printf '%s\n' "$out" | grep -qiE 'already exists|already uploaded'; then
            echo "envro-derive already on crates.io; continuing"
            exit 0
          fi
          exit "$status"

      - name: Wait for crates.io index
        if: steps.bump.outputs.skipped == 'false'
        run: sleep 30

      - name: Publish envro to crates.io
        if: steps.bump.outputs.skipped == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set +e
          out="$(cargo publish -p envro 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$out"
          if [[ "$status" -eq 0 ]]; then
            exit 0
          fi
          if printf '%s\n' "$out" | grep -qiE 'already exists|already uploaded'; then
            echo "envro already on crates.io; continuing"
            exit 0
          fi
          exit "$status"

      - name: Create GitHub Release
        if: steps.bump.outputs.skipped == 'false'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.bump.outputs.tag }}" \
            --title "${{ steps.bump.outputs.tag }}" \
            --generate-notes




