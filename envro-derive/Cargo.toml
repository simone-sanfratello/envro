[package]
name = "envro-derive"
version.workspace = true
edition = "2021"
description = "Derive macros for envro typed Config"
license = "MIT"
repository = "https://github.com/simone-sanfratello/envro"
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
